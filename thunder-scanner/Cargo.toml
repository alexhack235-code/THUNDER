[package]
name = "thunder-scanner"
version = "1.0.0"
edition = "2021"
authors = ["NEXO-TECH"]
description = "High-Performance Antivirus, Malware Scanner & Threat Remediation Engine"

[dependencies]
sha2 = "0.10.8"
md-5 = "0.10.6"
walkdir = "2.4.0"
colored = "2.1.0"
chrono = "0.4.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8.0"
regex = "1.10.2"
hex = "0.4.3"

[[bin]]
name = "thunder-scanner"
path = "src/main.rs"
